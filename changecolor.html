<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: green;
            transition: background-color 0.5s ease; /* Плавная смена цвета фона */
        }

        #myImage {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

    </style>
</head>
<body>

    <button id="mainBtn" onclick="changecolorbackground()">Сменить цвет</button>
    <h1 id="text">Старая картинка</h1>
    
    <img id="myImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRi_4Qiam4muej0Q1sC8UvDDuiwwpgg4Fi6O-4yfoI_-WvQxCcgSXWJ_1gU&s=10" alt="Старая картинка">

    <script>
    function changecolorbackground() {
        let img = document.getElementById('myImage');
        let header = document.getElementById('text');
        let btn = document.getElementById('mainBtn');

        if (document.body.style.backgroundColor === 'green') {
            document.body.style.backgroundColor = 'red';
            
            img.style.opacity = '0';
            img.style.transform = 'scale(0.8)';
            
            header.innerText = 'Внимание! Картинка скрыта';
            header.style.color = 'white';
            
            btn.classList.add('shaking-btn');
            btn.innerText = 'Остановить тревогу!';

        } else {
            document.body.style.backgroundColor = 'green';
            
            img.style.opacity = '1';
            img.style.transform = 'scale(1)';
            
            header.innerText = 'Старая картинка';
            header.style.color = 'black';
            
            btn.classList.remove('shaking-btn');
            btn.innerText = 'Сменить цвет';
        }
    }
    </script>

</body>
</html>
